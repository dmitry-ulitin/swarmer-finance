<nav class="account-list" aria-label="Filter by account">
  <div class="all-row-header">
    <button
      class="all-row-name"
      [class.active]="transactions.selectedAccountIds().length === 0"
      type="button"
      (click)="transactions.selectAllAccounts()"
    >All accounts</button>
    @if (state.summary() && !state.summary()?.incomplete) {
      <span class="all-row-balance">{{ state.summary()?.total  | currency: state.summary()?.currency : 'symbol' : '1.'+state.summary()?.scale+'-'+state.summary()?.scale }}</span>
    }
  </div>

  @for (item of state.groupedAccounts(); track item.kind === 'account' ? item.account.id : item.key) {
    <app-account-tree-node [item]="item" />
  }
</nav>
