<nav class="account-list" aria-label="Filter by account">
  <button
    class="row all-row"
    [class.active]="transactions.selectedAccountIds().length === 0"
    type="button"
    (click)="transactions.selectAllAccounts()"
  >
    <span class="all-row-name">All accounts</span>
    @if (totalBalance()) {
      <span class="all-row-balance">{{ totalBalance() }}</span>
    }
  </button>

  @for (node of state.groupedAccounts(); track node.fullPath) {
    <app-account-tree-node [node]="node" />
  }
</nav>
