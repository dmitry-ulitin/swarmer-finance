@if (node().name) {
  <div class="group-header" [style.padding-left]="indent">
    <button
      class="group-name"
      type="button"
      [class.active]="nodeAccountIds().every(id => transactions.selectedAccountIds().includes(id))"
      (click)="$event.ctrlKey || $event.metaKey ? transactions.toggleAccounts(nodeAccountIds()) : transactions.selectAccounts(nodeAccountIds())"
    >{{ node().name }}</button>
    <button
      class="chevron"
      type="button"
      [attr.aria-expanded]="store.isExpanded(node().fullPath)"
      [attr.aria-label]="'Toggle ' + node().name"
      (click)="store.toggleExpanded(node().fullPath)"
    >›</button>
  </div>
}

@if (!node().name || store.isExpanded(node().fullPath)) {
  @for (item of node().children; track item.kind === 'account' ? item.account.id : item.node.fullPath) {
    @if (item.kind === 'account') {
      <button
        class="account-row"
        type="button"
        [style.padding-left]="node().name ? 'calc(' + indent + ' + 1rem)' : indent"
        [class.active]="transactions.selectedAccountIds().includes(item.account.id)"
        (click)="$event.ctrlKey || $event.metaKey ? transactions.toggleAccount(item.account.id) : transactions.selectAccount(item.account.id)"
      >
        {{ item.account.displayName }}
      </button>
    } @else {
      <app-account-tree-node [node]="item.node" [depth]="node().name ? depth() + 1 : depth()" />
    }
  }
}
