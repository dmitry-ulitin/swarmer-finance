@if (node().name) {
  <button
    class="group-header"
    type="button"
    [style.padding-left]="indent"
    [attr.aria-expanded]="store.isExpanded(node().fullPath)"
    (click)="store.toggleExpanded(node().fullPath)"
  >
    <span class="group-name">{{ node().name }}</span>
    <span class="chevron" [class.collapsed]="!store.isExpanded(node().fullPath)" aria-hidden="true">›</span>
  </button>
}

@if (!node().name || store.isExpanded(node().fullPath)) {
  @for (account of node().accounts; track account.id) {
    <button
      class="account-row"
      type="button"
      [style.padding-left]="'calc(' + indent + ' + ' + (node().name ? '1.25rem' : '0.75rem') + ')'"
      [class.active]="transactions.selectedAccountIds().includes(account.id)"
      (click)="$event.ctrlKey || $event.metaKey ? transactions.toggleAccount(account.id) : transactions.selectAccount(account.id)"
    >
      {{ account.displayName }}
    </button>
  }

  @for (child of node().children; track child.fullPath) {
    <app-account-tree-node [node]="child" [depth]="node().name ? depth() + 1 : depth()" />
  }
}
