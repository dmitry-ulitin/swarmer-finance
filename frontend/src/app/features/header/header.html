<span class="title">Swarmer Finance</span>
@if(authService.isAuthenticated()) {
<button tuiIconButton tuiTheme="dark" appearance="flat-grayscale" size="xs" (click)="reload()" [iconStart]="'@tui.refresh-cw'"></button>
<button tuiIconButton tuiTheme="dark" appearance="flat-grayscale" size="xs" (click)="addTransaction()" [iconStart]="'@tui.diff'" aria-label="Add transaction" [disabled]="accountState.accounts().length === 0"></button>
}
@if(authService.isAuthenticated() && selectedTransaction()) {
<button tuiIconButton tuiTheme="dark" appearance="flat-grayscale" size="xs" (click)="editTransaction()" [iconStart]="'@tui.pencil'" aria-label="Edit transaction"></button>
<button tuiIconButton tuiTheme="dark" appearance="flat-grayscale" size="xs" (click)="deleteTransaction()" [iconStart]="'@tui.trash-2'" aria-label="Delete transaction"></button>
}
<div class="fill"></div>
@if(authService.isAuthenticated()) {
<button #settingsButton tuiButton tuiChevron type="button" appearance="flat-grayscale" size="xs" class="light" [tuiDropdown]="settingsDropdown" tuiDropdownAuto><tui-icon icon="@tui.settings"></tui-icon></button>
<ng-template #settingsDropdown>
  <tui-data-list [size]="'s'">
    <button tuiOption (click)="accounts();settingsButton.click()" [iconEnd]="'@tui.wallet'">Accounts</button>
    <button tuiOption (click)="categories();settingsButton.click()" [iconEnd]="'@tui.folder'">Categories</button>
  </tui-data-list>
</ng-template>
<span>{{ authService.user()?.name }}</span>
<button tuiButton tuiTheme="dark" appearance="flat-grayscale" size="xs" (click)="authService.logout()" [iconStart]="'@tui.user'">Logout</button>
}
