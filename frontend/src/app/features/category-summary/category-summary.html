@for (block of blocks(); track block.type) {
  <section class="block" [attr.data-type]="block.type" [attr.aria-label]="block.title">
    <button
      type="button"
      class="block-header"
      [class.selected]="transactions.selectedType() === block.type"
      [attr.aria-pressed]="transactions.selectedType() === block.type"
      (click)="transactions.selectType(block.type)"
    >
      <span class="block-title">{{ block.title }}</span>
      @if (block.total !== null) {
        <span class="block-total" [class.balance-blurred]="privacy.hidden()">{{ block.total | money: currency() : scale() }}</span>
      }
    </button>
    @for (row of block.rows; track row.category_id) {
      <button
        type="button"
        class="row"
        [class.selected]="selected().has(row.category_id)"
        [attr.aria-pressed]="selected().has(row.category_id)"
        [attr.aria-description]="row.hint"
        (click)="$event.ctrlKey || $event.metaKey ? transactions.toggleCategory(row.category_id) : transactions.selectCategory(row.category_id)"
      >
        <tui-icon class="icon" [icon]="'@tui.' + row.icon" [style.color]="row.color" />
        <span class="name">{{ row.name }}</span>
        @if (row.hint) {
          <span class="amount" [class.balance-blurred]="privacy.hidden()" [tuiHint]="row.hint">
            {{ row.total === null ? '—' : (row.total | money: currency() : scale()) }}
          </span>
        } @else {
          <span class="amount" [class.balance-blurred]="privacy.hidden()">{{ row.total | money: currency() : scale() }}</span>
        }
        <span class="bar" aria-hidden="true">
          <span class="bar-fill" [style.width.%]="row.share" [style.background]="row.color"></span>
        </span>
      </button>
    }
  </section>
}

@if (showTransfers()) {
  <section class="block" data-type="transfer" aria-label="Transfers">
    <button
      type="button"
      class="block-header transfers"
      [class.selected]="transactions.selectedType() === 'transfer'"
      [attr.aria-pressed]="transactions.selectedType() === 'transfer'"
      (click)="transactions.selectType('transfer')"
    >
      <span class="block-title">Transfers</span>
      @if (transfersNet() !== null && transferRows().length > 0) {
        <span class="block-total" [class.balance-blurred]="privacy.hidden()" tuiHint="Incoming minus outgoing">{{ transfersNet() | money: currency() : scale() }}</span>
      }
    </button>
    @for (row of transferRows(); track row.type) {
      <button
        type="button"
        class="row"
        [attr.data-transfer]="row.type"
        [class.selected]="transactions.selectedType() === row.type"
        [attr.aria-pressed]="transactions.selectedType() === row.type"
        [attr.aria-description]="row.hint"
        (click)="transactions.selectType(row.type)"
      >
        <tui-icon class="icon" [icon]="row.icon" />
        <span class="name">{{ row.name }}</span>
        @if (row.hint) {
          <span class="amount" [class.balance-blurred]="privacy.hidden()" [tuiHint]="row.hint">
            {{ row.total === null ? '—' : (row.total | money: currency() : scale()) }}
          </span>
        } @else {
          <span class="amount" [class.balance-blurred]="privacy.hidden()">{{ row.total | money: currency() : scale() }}</span>
        }
        <span class="bar" aria-hidden="true">
          <span class="bar-fill transfer-fill" [style.width.%]="row.share"></span>
        </span>
      </button>
    }
  </section>
}

@if (loading()) {
  <tui-loader class="loader" />
} @else if (!showTransfers()) {
  <p class="empty">No transactions.</p>
}
