<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" tuiTextfieldSize="m">
    <tui-textfield>
        <label tuiLabel>Current password</label>
        <input tuiInput tuiAutoFocus type="password" formControlName="currentPassword" autocomplete="current-password" />
        <tui-icon tuiPassword />
    </tui-textfield>

    <tui-textfield>
        <label tuiLabel>New password</label>
        <input tuiInput type="password" formControlName="newPassword" autocomplete="new-password" />
        <tui-icon tuiPassword />
    </tui-textfield>
    @if (form.controls.newPassword.hasError('minlength') && form.controls.newPassword.touched) {
        <p class="hint error" role="alert">At least {{ minLength }} characters.</p>
    }

    <tui-textfield>
        <label tuiLabel>Repeat new password</label>
        <input tuiInput type="password" formControlName="confirm" autocomplete="new-password" />
        <tui-icon tuiPassword />
    </tui-textfield>
    @if (form.hasError('mismatch') && form.controls.confirm.touched) {
        <p class="hint error" role="alert">Passwords do not match.</p>
    }

    <div class="actions">
        <button tuiButton size="s" type="button" appearance="outline" (click)="cancel()">Cancel</button>
        <button tuiButton size="s" type="submit" [disabled]="form.invalid || loading()">
            {{ loading() ? 'Saving...' : 'Change password' }}
        </button>
    </div>
</form>
