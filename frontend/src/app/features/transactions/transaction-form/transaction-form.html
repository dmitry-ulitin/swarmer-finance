<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" tuiTextfieldSize="m">

    <!-- Type selector -->
    <tui-segmented [activeItemIndex]="activeTypeIndex()" (activeItemIndexChange)="activeTypeIndex.set($event)"
        class="type-selector">
        <button type="button" [disabled]="!typeAllowed(0)">Expense</button>
        <button type="button" [disabled]="!typeAllowed(1)">Income</button>
        <button type="button" [disabled]="accountsState.accounts().length < 2 || !typeAllowed(2)">Transfer</button>
    </tui-segmented>

    <!-- Date -->
    <tui-textfield>
        <label tuiLabel>Date</label>
        <input tuiInputDate formControlName="date" />
        <tui-calendar *tuiDropdown />
    </tui-textfield>

    <!-- From / To accounts -->
    @if (isExpense() || isTransfer()) {
        <tui-textfield tuiChevron [tuiTextfieldCleaner]="false" [stringify]="stringifyAccount"
            [identityMatcher]="accountMatcher">
            <label tuiLabel>{{ isTransfer() ? 'From Account' : 'Account' }}</label>
            <input tuiSelect formControlName="fromAccount" placeholder="Select account" />
            <tui-data-list-wrapper *tuiDropdown [items]="accountOptions()" [itemContent]="accountTemplate" />
        </tui-textfield>
        <div class="row">
            <tui-textfield>
                <input tuiAutoFocus tuiInputNumber formControlName="debitAmount" [min]="0" [quantum]="debitQuantum()"
                    [tuiNumberFormat]="{ precision: debitPrecision() }"
                    placeholder="0.00" />
            </tui-textfield>
            <span>{{fromAccountValue()?.currency}}</span>
        </div>
    }
    @if (isIncome() || isTransfer()) {
        <tui-textfield tuiChevron [tuiTextfieldCleaner]="false" [stringify]="stringifyAccount"
            [identityMatcher]="accountMatcher">
            <label tuiLabel>{{ isTransfer() ? 'To Account' : 'Account' }}</label>
            <input tuiSelect formControlName="toAccount" placeholder="Select account" />
            <tui-data-list-wrapper *tuiDropdown [items]="accountOptions()" [itemContent]="accountTemplate" />
        </tui-textfield>
        @if (isIncome() || !isSameCurrency()) {
            <div class="row">
                <tui-textfield>
                    <input tuiAutoFocus tuiInputNumber formControlName="creditAmount" [min]="0" [quantum]="creditQuantum()"
                    [tuiNumberFormat]="{ precision: creditPrecision() }"
                        placeholder="0.00" />
                </tui-textfield>
                <span>{{toAccountValue()?.currency}}</span>
            </div>
        }
    }
    <!-- Category (Expense / Income only) -->
    @if (!isTransfer()) {
    <app-category-select [rootId]="categoryRootId()" formControlName="category" />
    }

    <!-- Optional fields -->
    <tui-textfield>
        <label tuiLabel>Payee</label>
        <input tuiInput formControlName="payee" placeholder="Optional" />
    </tui-textfield>
    <tui-textfield>
        <label tuiLabel>Description</label>
        <textarea tuiTextarea formControlName="description" placeholder="Optional"></textarea>
    </tui-textfield>

    <div class="actions">
        <button tuiButton size="s" type="button" appearance="outline" (click)="cancel()">Cancel</button>
        <button tuiButton size="s" type="submit">Save</button>
    </div>
</form>

<ng-template #accountTemplate let-item>
    {{ item.name }}
</ng-template>
